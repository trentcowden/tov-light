name: Tool

# Builds and tests the Tov tool. Replaces light-sdk's own workflows, which release
# the SDK itself and fail in a fork (they need Light's release secrets).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build
        run: ./gradlew :tool:testDebugUnitTest :tool:lintDebug :tool:assembleDebug -DlightSdk.toolOnly=true --stacktrace
